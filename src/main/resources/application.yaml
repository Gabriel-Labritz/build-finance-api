spring:
  application:
    name: build_finance_api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}

    properties:
     mail:
       smtp:
         auth: true
         starttls:
          enable: true

app:
  email:
   origin: ${EMAIL_USERNAME}
   sender: Build Finance
  url:
   site: http://localhost:8080